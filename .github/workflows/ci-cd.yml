# Pipeline CI/CD do Telemetria Status.
# CI: preparação → validação → testes → build. CD: deploy no Cloudflare Pages → verificação pós-deploy.
# O deploy só acontece se todas as etapas anteriores passarem.
name: CI/CD — Telemetria Status

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PROJETO_PAGES: ${{ vars.CF_PAGES_PROJECT || 'telemetria-status' }}

jobs:
  setup:
    name: 🔧 Preparação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Mostrar o ambiente
        run: |
          echo "Node $(node --version) · npm $(npm --version)"
          echo "Evento: $GITHUB_EVENT_NAME · Ramo: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} · Commit: ${GITHUB_SHA::7}"
          ls -la

  validacao:
    name: ✅ Validação
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Verificar se o index.html existe
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html não encontrado!"
            exit 1
          fi
          echo "Arquivo OK ✅"

      - name: Validar o HTML (html-validate)
        run: npm run validar:html

      - name: Verificar a sintaxe do JavaScript
        run: npm run validar:js

      - name: Validar a lista de serviços (config/servicos.json)
        run: npm run validar:config

  testes:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    needs: validacao
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Rodar os testes automatizados (com cobertura)
        run: npm test 2>&1 | tee resultado-testes.txt

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### 🧪 Testes"
            echo '```'
            grep -E "^# (tests|pass|fail)" resultado-testes.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 🏗 Build
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Buscar o histórico mais recente (ramo "dados")
        run: |
          if git fetch --depth=1 origin dados 2>/dev/null; then
            git show FETCH_HEAD:status.json > dados/status.json
            echo "Histórico atualizado a partir do ramo dados."
          else
            echo "Ramo dados ainda não existe: usando o arquivo inicial."
          fi

      - name: Gerar o site (dist/)
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: Conferir o artefato
        run: ls -laR dist

      - name: Guardar o artefato
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: 🚀 Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: build
    # Pull requests vindos de forks não recebem os segredos, então não publicam.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Baixar o artefato do build
        uses: actions/download-artifact@v7
        with:
          name: site
          path: dist

      - name: Conferir os segredos do Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CONTA" ]; then
            echo "::error::Cadastre os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Criar o projeto no Cloudflare Pages (se ainda não existir)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJETO_PAGES"; then
            echo "Projeto $PROJETO_PAGES já existe."
          else
            npx --yes wrangler@4 pages project create "$PROJETO_PAGES" --production-branch=main
          fi

      - name: Publicar no Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJETO_PAGES }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumo do deploy
        run: |
          {
            echo "### 🚀 Deploy concluído"
            echo "- Ambiente: **${{ github.event_name == 'pull_request' && 'prévia' || 'produção' }}**"
            echo "- Endereço desta versão: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Endereço fixo do ramo: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar o link da prévia no pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "🔎 Prévia publicada pelo pipeline: $URL"

  verificacao:
    name: 🔎 Verificação pós-deploy
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Conferir se o site publicado responde com a versão nova
        env:
          URL: ${{ needs.deploy.outputs.url }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Endereço publicado: $URL"
          if [ -z "$URL" ]; then
            echo "::error::O deploy não informou o endereço publicado."
            exit 1
          fi
          # Num projeto recém-criado, o Cloudflare pode levar alguns minutos para ativar o endereço.
          for tentativa in $(seq 1 18); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" || echo "000")
            if [ "$codigo" = "200" ] &&
               curl -fsS "$URL/" | grep -q "Telemetria Status" &&
               curl -fsS "$URL/build-info.json" | grep -q "$COMMIT"; then
              echo "✅ $URL está no ar com o commit ${COMMIT::7}."
              echo "### 🔎 Verificação pós-deploy: OK (commit ${COMMIT::7})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Tentativa $tentativa/18: HTTP $codigo, ainda sem a versão nova; aguardando 10 s…"
            sleep 10
          done
          echo "::error::O site publicado não respondeu com a versão nova em 3 minutos."
          exit 1
