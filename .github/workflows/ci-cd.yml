# Pipeline CI/CD do Telemetria Status.
# CI: preparação → validação → testes + segurança (em paralelo) → build.
# CD: deploy no Cloudflare Pages → verificação pós-deploy.
# O deploy só acontece se todas as etapas anteriores passarem.
name: CI/CD — Telemetria Status

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash com pipefail: um erro antes do "| tee" também falha a etapa

env:
  NODE_VERSION: 24
  PROJETO_PAGES: ${{ vars.CF_PAGES_PROJECT || 'telemetria-status' }}

jobs:
  setup:
    name: 🔧 Preparação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Mostrar o ambiente
        run: |
          echo "Node $(node --version) · npm $(npm --version)"
          echo "Evento: $GITHUB_EVENT_NAME · Ramo: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} · Commit: ${GITHUB_SHA::7}"
          ls -la

  validacao:
    name: ✅ Validação
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Verificar se o index.html existe
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html não encontrado!"
            exit 1
          fi
          echo "Arquivo OK ✅"

      - name: Validar o HTML (html-validate)
        run: npm run validar:html

      - name: Verificar a sintaxe do JavaScript
        run: npm run validar:js

      - name: Validar a lista de serviços (config/servicos.json)
        run: npm run validar:config

  testes:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    needs: validacao
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Rodar os testes automatizados (com cobertura)
        run: npm test 2>&1 | tee resultado-testes.txt

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### 🧪 Testes"
            echo '```'
            grep -E "^# (tests|pass|fail)" resultado-testes.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  seguranca:
    name: 🔐 Segurança
    runs-on: ubuntu-latest
    needs: validacao
    permissions:
      contents: read
      actions: read
      security-events: write   # publicar os alertas do CodeQL na aba Security
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Procurar senhas e tokens no código
        run: node scripts/verificar-segredos.mjs

      - name: Auditar as dependências (npm audit)
        run: |
          npm audit --audit-level=high | tee auditoria.txt
          echo "### 🔐 Dependências: $(tail -1 auditoria.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar a análise de código (CodeQL)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analisar o código (CodeQL)
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql
          # O Dependabot não tem permissão para publicar alertas; nesse caso a análise roda sem enviar.
          upload: ${{ github.actor == 'dependabot[bot]' && 'never' || 'always' }}

      - name: Bloquear se houver vulnerabilidade grave
        run: node scripts/portao-codeql.mjs "${{ runner.temp }}/codeql"

  build:
    name: 🏗 Build
    runs-on: ubuntu-latest
    needs: [testes, seguranca]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Buscar o histórico mais recente (ramo "dados")
        run: |
          if git fetch --depth=1 origin dados 2>/dev/null; then
            git show FETCH_HEAD:status.json > dados/status.json
            if git show FETCH_HEAD:dora.json > /tmp/dora.json 2>/dev/null; then cp /tmp/dora.json dados/dora.json; fi
            echo "Histórico atualizado a partir do ramo dados."
          else
            echo "Ramo dados ainda não existe: usando o arquivo inicial."
          fi

      - name: Gerar o site (dist/)
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: Conferir o artefato
        run: ls -laR dist

      - name: Guardar o artefato
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: 🚀 Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: build
    # Pull requests vindos de forks e do Dependabot não recebem os segredos, então não publicam.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # O código é necessário para publicar as Pages Functions (functions/ e lib/), que protegem a área /admin.
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Baixar o artefato do build
        uses: actions/download-artifact@v7
        with:
          name: site
          path: dist

      - name: Conferir os segredos do Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CONTA" ]; then
            echo "::error::Cadastre os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Criar o projeto no Cloudflare Pages (se ainda não existir)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -w "$PROJETO_PAGES" > /dev/null; then
            echo "Projeto $PROJETO_PAGES já existe."
          else
            npx --yes wrangler@4 pages project create "$PROJETO_PAGES" --production-branch=main
          fi

      # Os segredos ficam guardados no GitHub e são repassados ao Cloudflare; nunca aparecem no código nem no log.
      - name: Enviar os segredos da área de gestão ao Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_SENHA" ]; then
            echo "::warning::Segredo ADMIN_SENHA não cadastrado: a área /admin fica desativada."
            exit 0
          fi
          printf '%s' "$ADMIN_SENHA" | npx --yes wrangler@4 pages secret put ADMIN_SENHA --project-name "$PROJETO_PAGES"
          printf '%s' "$GITHUB_REPOSITORY" | npx --yes wrangler@4 pages secret put GH_REPO --project-name "$PROJETO_PAGES"
          if [ -n "$GH_ADMIN_TOKEN" ]; then
            printf '%s' "$GH_ADMIN_TOKEN" | npx --yes wrangler@4 pages secret put GH_ADMIN_TOKEN --project-name "$PROJETO_PAGES"
          else
            echo "::notice::Sem GH_ADMIN_TOKEN: a área /admin funciona no modo manual (gera o arquivo para colar no GitHub)."
          fi

      - name: Publicar no Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJETO_PAGES }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumo do deploy
        run: |
          {
            echo "### 🚀 Deploy concluído"
            echo "- Ambiente: **${{ github.event_name == 'pull_request' && 'prévia' || 'produção' }}**"
            echo "- Endereço desta versão: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Endereço fixo do ramo: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar o link da prévia no pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "🔎 Prévia publicada pelo pipeline: $URL"

  verificacao:
    name: 🔎 Verificação pós-deploy
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Conferir se o site publicado responde com a versão nova
        env:
          URL: ${{ needs.deploy.outputs.url }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Endereço publicado: $URL"
          if [ -z "$URL" ]; then
            echo "::error::O deploy não informou o endereço publicado."
            exit 1
          fi
          # Num projeto recém-criado, o Cloudflare pode levar alguns minutos para ativar o endereço.
          for tentativa in $(seq 1 18); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" || echo "000")
            if [ "$codigo" = "200" ] &&
               curl -fsS "$URL/" | grep "Telemetria Status" > /dev/null &&
               curl -fsS "$URL/build-info.json" | grep "$COMMIT" > /dev/null; then
              echo "✅ $URL está no ar com o commit ${COMMIT::7}."
              # Teste de segurança: a área de gestão não pode abrir sem senha (401) ou deve estar desativada (503).
              admin=$(curl -s -o /dev/null -w "%{http_code}" "$URL/admin/")
              if [ "$admin" != "401" ] && [ "$admin" != "503" ]; then
                echo "::error::A área /admin respondeu HTTP $admin sem senha (esperado 401)."
                exit 1
              fi
              echo "🔒 /admin sem senha responde HTTP $admin (protegida)."
              fonte=$(curl -fsS -D - -o /dev/null "$URL/dados/status.json" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-fonte-dados"{print $2}')
              echo "📡 Dados servidos a partir de: ${fonte:-desconhecido}"
              {
                echo "### 🔎 Verificação pós-deploy: OK (commit ${COMMIT::7})"
                echo "- Área /admin sem senha: HTTP $admin (protegida)"
                echo "- Dados do painel: ${fonte:-desconhecido}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Tentativa $tentativa/18: HTTP $codigo, ainda sem a versão nova; aguardando 10 s…"
            sleep 10
          done
          echo "::error::O site publicado não respondeu com a versão nova em 3 minutos."
          exit 1
