# Monitoramento agendado: verifica os serviços a cada 15 minutos,
# grava o histórico no ramo "dados" e publica o painel atualizado.
name: Monitoramento — verificação agendada

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # a cada 15 min (fora do minuto 0, que é o mais congestionado)
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: monitoramento
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PROJETO_PAGES: ${{ vars.CF_PAGES_PROJECT || 'telemetria-status' }}

jobs:
  verificar:
    name: 📡 Verificar serviços e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Buscar o histórico (ramo "dados")
        run: |
          if git fetch --depth=1 origin dados 2>/dev/null; then
            git show FETCH_HEAD:status.json > dados/status.json
          else
            echo "Primeira execução: o histórico começa agora."
          fi

      - name: Verificar os serviços
        run: npm run verificar

      - name: Gravar o histórico no ramo "dados"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/dados && mkdir -p /tmp/dados
          cp dados/status.json /tmp/dados/status.json
          cd /tmp/dados
          git init -q -b dados
          git config user.name "telemetria-status[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -qm "Verificação de $(date -u +%Y-%m-%dT%H:%MZ)"
          # Um único commit sobrescrito a cada rodada: o histórico de verificações fica no próprio arquivo.
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados

      - name: Testar antes de publicar
        run: npm run validar:config && npm test

      - name: Gerar o site
        run: npm run build

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJETO_PAGES }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
