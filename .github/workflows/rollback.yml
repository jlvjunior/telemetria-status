# Rollback: volta o site em produção para uma versão anterior em segundos, sem rebuild.
# Uso: Actions → "Rollback — voltar versão" → Run workflow.
# A próxima alteração enviada para a main publica normalmente de novo (correção "para frente").
name: Rollback — voltar versão

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo do rollback (aparece no resumo)'
        required: true
        type: string
      commit:
        description: 'Commit para restaurar (7+ caracteres). Vazio = versão anterior à que está no ar'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: rollback
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24
  PROJETO_PAGES: ${{ vars.CF_PAGES_PROJECT || 'telemetria-status' }}

jobs:
  rollback:
    name: ↩️ Rollback da produção
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.voltar.outputs.endereco }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Voltar a produção para a versão escolhida
        id: voltar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ inputs.commit }}
          MOTIVO: ${{ inputs.motivo }}
        run: node scripts/rollback.mjs

      - name: Conferir se o site voltou para a versão escolhida
        env:
          URL: ${{ steps.voltar.outputs.endereco }}
          COMMIT: ${{ steps.voltar.outputs.commit }}
        run: |
          for tentativa in $(seq 1 12); do
            if curl -fsS "$URL/build-info.json?t=$(date +%s)" | grep "$COMMIT" > /dev/null; then
              echo "✅ $URL voltou para o commit ${COMMIT::7}."
              echo "### 🔎 Conferido: $URL está no commit ${COMMIT::7}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Tentativa $tentativa/12: aguardando o Cloudflare trocar a versão…"
            sleep 5
          done
          echo "::error::O site não mostrou a versão restaurada em 1 minuto."
          exit 1
